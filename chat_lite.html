<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Lite</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --user: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .chat {
      width: min(100%, 760px);
      height: min(760px, calc(100vh - 32px));
      min-height: 520px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(17, 24, 39, .94);
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid #263244;
    }

    .status {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    h1 { margin: 0; font-size: 1.1rem; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: .85rem; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--panel-2);
      border-bottom-right-radius: 5px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-left-radius: 5px;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #263244;
      background: rgba(15, 23, 42, .7);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 130px;
      padding: 13px 15px;
      border: 1px solid #475569;
      border-radius: 14px;
      outline: none;
      background: #0f172a;
      color: var(--text);
      font: inherit;
    }

    textarea:focus { border-color: var(--accent); }

    button {
      align-self: stretch;
      min-width: 84px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #052e16;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .6; cursor: wait; }

    @media (max-width: 520px) {
      .chat { height: calc(100vh - 20px); min-height: 0; border-radius: 14px; }
      body { padding: 10px; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="واجهة Chat Lite">
    <header>
      <span class="status" aria-hidden="true"></span>
      <div>
        <h1>Chat Lite</h1>
        <p class="subtitle">محادثة تجريبية خفيفة وسريعة</p>
      </div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="empty" id="empty">اكتب رسالتك للبدء 👋</div>
    </section>

    <form id="chat-form">
      <textarea id="input" rows="1" placeholder="اكتب رسالة..." aria-label="نص الرسالة" required></textarea>
      <button id="send" type="submit">إرسال</button>
    </form>
  </main>

  <script>
    const OLLAMA_URL = 'http://localhost:11434/api/generate';
    const MODEL = 'llama3';
    const REQUEST_TIMEOUT_MS = 120000;
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const send = document.getElementById('send');

    function addMessage(text, type) {
      document.getElementById('empty')?.remove();
      const message = document.createElement('div');
      message.className = `message ${type}`;
      message.textContent = text;
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    function resizeInput() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
    }

    function setLoading(isLoading) {
      send.disabled = isLoading;
      input.disabled = isLoading;
      send.textContent = isLoading ? 'جاري...' : 'إرسال';
    }

    async function requestOllama(prompt) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(OLLAMA_URL, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: MODEL,
            prompt,
            stream: false
          }),
          signal: controller.signal
        });

        const rawBody = await response.text();
        let data;
        try {
          data = rawBody ? JSON.parse(rawBody) : null;
        } catch {
          throw new Error('استجابة Ollama ليست JSON صالحاً');
        }

        if (!response.ok) {
          const reason = data?.error || `HTTP ${response.status}`;
          throw new Error(`فشل طلب Ollama: ${reason}`);
        }

        if (typeof data?.response !== 'string' || !data.response.trim()) {
          throw new Error('لم تُرجع Ollama قيمة response نصية');
        }

        return data.response.trim();
      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error('انتهت مهلة الاتصال بـ Ollama بعد دقيقتين');
        }
        if (error instanceof TypeError) {
          throw new Error(
            'تعذر الوصول إلى Ollama. شغّل Ollama وتأكد من السماح بالمصدر عبر OLLAMA_ORIGINS.'
          );
        }
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    input.addEventListener('input', resizeInput);

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = input.value.trim();
      if (!prompt || send.disabled) return;

      addMessage(prompt, 'user');
      input.value = '';
      resizeInput();
      setLoading(true);

      try {
        const answer = await requestOllama(prompt);
        addMessage(answer, 'bot');
      } catch (error) {
        console.error('Ollama request failed:', error);
        addMessage(`تعذر الحصول على رد من Ollama.\n\n${error.message}`, 'bot');
      } finally {
        setLoading(false);
        input.focus();
      }
    });
  </script>
</body>
</html>
